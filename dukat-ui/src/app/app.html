<div class="min-h-screen bg-slate-900 text-white p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-emerald-400">Dukat – Twoje Konta</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let acc of accounts" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-semibold text-slate-200">{{ acc.name }}</h2>
        <p class="text-sm text-slate-400 mb-4">Typ: {{ acc.accountType }}</p>
        <p class="text-2xl font-bold text-emerald-400">{{ acc.balance | currency:'PLN':'symbol':'1.2-2' }}</p>
      </div>
    </div>

    <div *ngIf="accounts.length === 0" class="text-slate-400 italic">
      Ładowanie kont lub brak danych w bazie...
    </div>
  </div>
</div>
