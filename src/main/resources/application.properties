spring.application.name=dukat

# --- POŁĄCZENIE Z BAZĄ DANYCH POSTGRESQL (DOCKER) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/dukat_db
spring.datasource.username=dukatuser
spring.datasource.password=dukatpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JIK / HIBERNATE ---
# Automatically create / update tables based on Java entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for learning and debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8082