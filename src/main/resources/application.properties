spring.application.name=dukat
# Lokalnie czytamy ignorowany .env; Docker dostarcza te same wartości jako environment.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dukat_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${SERVER_PORT:8082}
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=3600
app.bootstrap.enabled=true
app.bootstrap.username=${DUKAT_BOOTSTRAP_USERNAME:user}
app.bootstrap.password=${DUKAT_BOOTSTRAP_PASSWORD}
app.bootstrap.email=${DUKAT_BOOTSTRAP_EMAIL:user@dukat.local}
app.scheduling.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.flyway.validate-migration-naming=true
